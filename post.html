<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');

/* --- tiny dependency-free Markdown renderer --- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}
function mdToHtml(md){
  var lines = md.replace(/\r\n?/g,'\n').split('\n'), out=[], i=0;
  var blockStart=/^(#{1,6}\s|>\s?|```|\s*[-*+]\s+|\s*\d+\.\s+|\s*<)/;
  while(i<lines.length){
    var line=lines[i];
    if(/^```/.test(line)){ var buf=[]; i++; while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; } i++; out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    var h=/^(#{1,6})\s+(.*)$/.exec(line);
    if(h){ var lvl=Math.min(h[1].length+1,4); if(lvl<2)lvl=2; out.push('<h'+lvl+'>'+inline(h[2])+'</h'+lvl+'>'); i++; continue; }
    if(/^>\s?/.test(line)){ var qb=[]; while(i<lines.length && /^>\s?/.test(lines[i])){ qb.push(lines[i].replace(/^>\s?/,'')); i++; } out.push('<blockquote>'+inline(qb.join(' '))+'</blockquote>'); continue; }
    if(/^\s*[-*+]\s+/.test(line)){ var ul=[]; while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ ul.push('<li>'+inline(lines[i].replace(/^\s*[-*+]\s+/,''))+'</li>'); i++; } out.push('<ul>'+ul.join('')+'</ul>'); continue; }
    if(/^\s*\d+\.\s+/.test(line)){ var ol=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ ol.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++; } out.push('<ol>'+ol.join('')+'</ol>'); continue; }
    if(/^\s*$/.test(line)){ i++; continue; }
    if(/^\s*</.test(line)){ out.push(line); i++; continue; }
    var para=[line]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !blockStart.test(lines[i]) && !/^\s*(---|\*\*\*|___)\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push('<p>'+inline(para.join(' '))+'</p>');
  }
  return out.join('\n');
}
function fmtDate(s){ try{ return new Date(s+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return s; } }

(function(){
  var slug=(new URLSearchParams(location.search).get('slug')||'').trim();
  var titleEl=document.getElementById('ptitle'), metaEl=document.getElementById('pmeta'), bodyEl=document.getElementById('pbody');
  if(!/^[a-z0-9][a-z0-9-]*$/i.test(slug)){ titleEl.textContent='Post not found'; bodyEl.innerHTML='<p>No such post. <a href="blog.html">Back to all posts</a>.</p>'; return; }
  var meta=null;
  fetch('posts.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(posts){
    meta=(posts||[]).filter(function(p){return p.slug===slug;})[0];
    return fetch('posts/'+slug+'.md',{cache:'no-store'});
  }).then(function(r){ if(!r.ok) throw new Error('missing'); return r.text(); }).then(function(md){
    var title = meta ? meta.title : slug;
    document.title = title+' · Bharath Naveen';
    titleEl.textContent=title;
    if(meta){
      var mins = meta.readingMins ? ' &nbsp;·&nbsp; '+meta.readingMins+' min read' : '';
      var tags = (meta.tags||[]).map(function(t){return '<span class="ptag">'+esc(t)+'</span>';}).join('');
      metaEl.innerHTML = fmtDate(meta.date)+mins + (tags?'<span class="ptags" style="margin-top:0">'+tags+'</span>':'');
    }
    bodyEl.innerHTML = mdToHtml(md);
  }).catch(function(){
    titleEl.textContent='Could not load this post';
    bodyEl.innerHTML='<p>If you are opening this file directly from disk, the browser blocks loading the post for security. It works normally on the live site (bharathnaveen.com) or via a local server.</p>';
  });
})();
</script>
