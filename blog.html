<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing · Bharath Naveen</title>
<meta name="description" content="Build logs and writeups from Bharath Naveen's data science and machine learning projects.">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/blog.css">
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html"><img src="assets/apple-touch-icon.png" alt=""> Bharath <span>Naveen</span></a>
    <div class="nav-r">
      <a href="index.html#work">Work</a>
      <a href="index.html">Home</a>
      <button class="ttoggle" id="themeBtn" aria-label="Toggle light and dark theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<header class="bhead">
  <div class="wrap">
    <p class="eyebrow">Writing</p>
    <h1>Build logs &amp; writeups</h1>
    <p>Notes from my data science and machine learning projects: what I'm building, the problems I hit, and what I learned. New posts as the work happens.</p>
  </div>
</header>

<main class="wrap">
  <div class="plist" id="plist">
    <div class="empty" id="empty" hidden>No posts yet. Check back soon.</div>
  </div>
</main>

<footer>
  <div class="foot-in">
    <span>&copy; <span id="yr"></span> Bharath Naveen · Tucson, AZ</span>
    <a href="index.html">bharathnaveen.com</a>
  </div>
</footer>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');
  function cur(){ return root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }
  btn.addEventListener('click', function(){ root.setAttribute('data-theme', cur()==='dark'?'light':'dark'); });
  document.getElementById('yr').textContent=new Date().getFullYear();
})();
(function(){
  var list=document.getElementById('plist'), empty=document.getElementById('empty');
  function fmtDate(s){ try{ var d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return s; } }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  fetch('posts.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(posts){
    posts = posts.slice().sort(function(a,b){ return (a.date<b.date?1:-1); });
    if(!posts.length){ empty.hidden=false; return; }
    posts.forEach(function(p){
      var tags = (p.tags||[]).map(function(t){ return '<span class="ptag">'+esc(t)+'</span>'; }).join('');
      var mins = p.readingMins ? ' &nbsp;·&nbsp; '+p.readingMins+' min read' : '';
      var a=document.createElement('a');
      a.className='pcard'; a.href='post.html?slug='+encodeURIComponent(p.slug);
      a.innerHTML =
        '<div class="pmeta">'+fmtDate(p.date)+mins+'</div>'+
        '<h2>'+esc(p.title)+'</h2>'+
        (p.summary?'<p class="psum">'+esc(p.summary)+'</p>':'')+
        (tags?'<div class="ptags">'+tags+'</div>':'')+
        '<div class="readmore">Read post <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>';
      list.appendChild(a);
    });
  }).catch(function(){
    empty.textContent='Could not load posts. (On a local file this needs the live site or a local server; on bharathnaveen.com it works normally.)';
    empty.hidden=false;
  });
})();
</script>
</body>
</html>
